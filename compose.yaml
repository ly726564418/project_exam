services:
  atlas:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - atlas-data:/data
    cpus: 4
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ATLAS_DB: /data/atlas.sqlite
      ATLAS_DISK_BUDGET_MB: 18000
      ATLAS_GENERATOR_URL: http://host.docker.internal:9001
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  atlas-data:
